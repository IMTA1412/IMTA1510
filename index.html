<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SDGs Plastic-Free Sustainability – Beach Cleanup</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
      background: #8ed8ff;
    }

    .game {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 12%, #fff7a8 0 45px, transparent 46px),
        linear-gradient(to bottom, #78cfff 0%, #9ce5ff 28%, #35b8df 29%, #209fc3 46%, #f7dc96 47%, #edc977 100%);
    }

    .game::before {
      content: "";
      position: absolute;
      left: -8%;
      top: 34%;
      width: 116%;
      height: 90px;
      background: repeating-radial-gradient(ellipse at center, rgba(255,255,255,.9) 0 4px, transparent 5px 16px);
      opacity: .75;
      transform: rotate(-2deg);
      pointer-events: none;
    }

    .game::after {
      content: "";
      position: absolute;
      left: -10%;
      bottom: 0;
      width: 120%;
      height: 53%;
      background:
        radial-gradient(circle at 18% 78%, rgba(127, 91, 42, .18) 0 2px, transparent 3px),
        radial-gradient(circle at 50% 55%, rgba(127, 91, 42, .14) 0 2px, transparent 3px),
        radial-gradient(circle at 80% 70%, rgba(127, 91, 42, .13) 0 2px, transparent 3px),
        linear-gradient(165deg, #f7df9c, #efc76e 72%, #e5b95e);
      background-size: 180px 130px, 150px 110px, 220px 150px, auto;
      pointer-events: none;
      z-index: 1;
    }

    header {
      position: fixed;
      z-index: 10;
      top: 0;
      left: 0;
      width: 100%;
      padding: 22px 28px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      color: #083344;
      text-shadow: 0 2px 8px rgba(255,255,255,.75);
      pointer-events: none;
    }

    h1 {
      max-width: 58vw;
      font-size: clamp(24px, 3vw, 48px);
      font-weight: 900;
      line-height: 1.05;
    }

    .hud {
      min-width: 230px;
      padding: 14px 18px;
      border-radius: 20px;
      background: rgba(255,255,255,.72);
      box-shadow: 0 12px 30px rgba(0,0,0,.12);
      backdrop-filter: blur(8px);
      font-weight: 800;
      font-size: 18px;
      text-align: right;
    }

    .hud small {
      display: block;
      margin-top: 5px;
      font-size: 13px;
      font-weight: 700;
      opacity: .75;
    }

    #trashLayer {
      position: absolute;
      inset: 0;
      z-index: 4;
    }

    .trash {
      position: absolute;
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: var(--size);
      width: calc(var(--size) * 1.45);
      height: calc(var(--size) * 1.45);
      display: grid;
      place-items: center;
      transform: rotate(var(--rotation));
      filter: drop-shadow(0 5px 5px rgba(60, 36, 5, .32));
      transition: transform .16s ease, opacity .16s ease;
      user-select: none;
    }

    .trash:hover {
      transform: rotate(var(--rotation)) scale(1.18);
    }

    .trash.collected {
      pointer-events: none;
      opacity: 0;
      transform: rotate(var(--rotation)) scale(.2) translateY(-25px);
    }

    .complete {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      place-items: center;
      background: rgba(8, 51, 68, .34);
      backdrop-filter: blur(3px);
    }

    .complete.show { display: grid; }

    .complete-card {
      padding: 42px 54px;
      border-radius: 30px;
      background: rgba(255, 255, 255, .92);
      color: #064e3b;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
      animation: pop .36s ease-out;
    }

    .complete-card h2 {
      font-size: clamp(38px, 6vw, 78px);
      margin-bottom: 12px;
    }

    .complete-card p {
      font-size: 22px;
      font-weight: 800;
      color: #0f766e;
    }

    .complete-card button {
      margin-top: 24px;
      padding: 13px 24px;
      border: none;
      border-radius: 999px;
      background: #0f766e;
      color: white;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
    }

    @keyframes pop {
      from { transform: scale(.82); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    @media (max-width: 760px) {
      header {
        padding: 16px;
        flex-direction: column;
      }
      h1 { max-width: 100%; }
      .hud { align-self: flex-end; font-size: 16px; }
    }
  </style>
</head>
<body>
  <main class="game" aria-label="Beach cleanup game">
    <header>
      <h1>SDGs Plastic-Free Sustainability – Beach Cleanup</h1>
      <section class="hud" aria-live="polite">
        <div>Score: <span id="score">0</span></div>
        <div>Collected: <span id="collected">0</span> / <span id="total">50</span></div>
        <small id="performance">Performance: Start cleaning!</small>
      </section>
    </header>

    <section id="trashLayer" aria-label="Clickable trash items"></section>

    <section id="complete" class="complete" role="dialog" aria-modal="true">
      <div class="complete-card">
        <h2>Mission Complete!</h2>
        <p>Go to the Next Level 🌊</p>
        <button onclick="startGame()">Play Again</button>
      </div>
    </section>
  </main>

  <script>
    const TOTAL_TRASH = 50;
    const trashLayer = document.getElementById('trashLayer');
    const scoreEl = document.getElementById('score');
    const collectedEl = document.getElementById('collected');
    const totalEl = document.getElementById('total');
    const performanceEl = document.getElementById('performance');
    const completeEl = document.getElementById('complete');

    const trashTypes = [
      { name: 'plastic bottle', icon: '🧴', min: 28, max: 46, score: 10 },
      { name: 'paper container', icon: '🥡', min: 30, max: 50, score: 12 },
      { name: 'plastic bag', icon: '🛍️', min: 34, max: 56, score: 16 },
      { name: 'styrofoam', icon: '📦', min: 26, max: 48, score: 14 },
      { name: 'drink cup', icon: '🥤', min: 28, max: 48, score: 11 },
      { name: 'can waste', icon: '🥫', min: 24, max: 42, score: 13 },
      { name: 'floating waste', icon: '🧃', min: 25, max: 45, score: 15 },
      { name: 'wrapper', icon: '🍬', min: 22, max: 36, score: 8 }
    ];

    let score = 0;
    let collected = 0;
    let startTime = Date.now();

    function random(min, max) {
      return Math.random() * (max - min) + min;
    }

    function randomTrashType() {
      return trashTypes[Math.floor(Math.random() * trashTypes.length)];
    }

    function performanceText() {
      const seconds = Math.max(1, Math.floor((Date.now() - startTime) / 1000));
      const rate = (collected / seconds).toFixed(2);
      if (collected === 0) return 'Performance: Start cleaning!';
      if (rate >= 1.2) return `Performance: Excellent • ${rate} items/sec`;
      if (rate >= 0.7) return `Performance: Great • ${rate} items/sec`;
      return `Performance: Steady • ${rate} items/sec`;
    }

    function updateHud() {
      scoreEl.textContent = score;
      collectedEl.textContent = collected;
      performanceEl.textContent = performanceText();
    }

    function createTrash(index) {
      const type = randomTrashType();
      const size = random(type.min, type.max);
      const item = document.createElement('button');

      item.className = 'trash';
      item.type = 'button';
      item.textContent = type.icon;
      item.title = `${type.name}: ${type.score} points`;
      item.setAttribute('aria-label', `Collect ${type.name} worth ${type.score} points`);

      item.style.setProperty('--size', `${size}px`);
      item.style.setProperty('--rotation', `${random(-85, 85)}deg`);

      const x = random(2, 94);
      const y = random(50, 92);
      item.style.left = `${x}%`;
      item.style.top = `${y}%`;

      item.dataset.score = Math.round(type.score + (size - type.min) * 0.25);

      item.addEventListener('click', () => {
        if (item.classList.contains('collected')) return;
        item.classList.add('collected');
        score += Number(item.dataset.score);
        collected += 1;
        updateHud();

        if (collected === TOTAL_TRASH) {
          setTimeout(() => completeEl.classList.add('show'), 280);
        }
      });

      return item;
    }

    function startGame() {
      trashLayer.innerHTML = '';
      score = 0;
      collected = 0;
      startTime = Date.now();
      completeEl.classList.remove('show');
      totalEl.textContent = TOTAL_TRASH;
      updateHud();

      const fragment = document.createDocumentFragment();
      for (let i = 0; i < TOTAL_TRASH; i++) {
        fragment.appendChild(createTrash(i));
      }
      trashLayer.appendChild(fragment);
    }

    startGame();
    setInterval(updateHud, 1000);
  </script>
</body>
</html>
